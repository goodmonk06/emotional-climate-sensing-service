version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: emotional-climate-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emotional_climate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emotional-climate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: emotional-climate-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emotional_climate?schema=public
      PORT: 3001
      NODE_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emotional-climate-network
    restart: unless-stopped
    command: >
      sh -c "
        pnpm db:migrate:deploy &&
        pnpm start
      "

  # Web Dashboard
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: emotional-climate-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - emotional-climate-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  emotional-climate-network:
    driver: bridge
